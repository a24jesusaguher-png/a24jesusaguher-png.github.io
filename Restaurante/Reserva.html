<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="TU NOMBRE">
    <meta name="description" content="Formulario para reservar mesa">
    <meta name="keywords" content="reserva, restaurante">
    <title>Reserva</title>
    
    <link rel="icon" type="image/png" href="Carta/foto restaurante/favicon.png">
</head>

<body>

    <header>
        <h1>Chicote el Flaco</h1>
        <h2>Haz una reserva</h2>
    </header>

    <nav>
        <a href="../Restaurante/Index.html">Volver al Restaurante</a>
        <br>
        <a href="../index.html">Volver al inicio</a>
        <br>
        <a href="../Restaurante/Carta/Carta.html">Ver la carta</a>
    </nav>

    <main>

        <form>
            <p>
                Tu nombre:
                <input type="text" name="nombre">
            </p>

            <p>
                Número de clientes:
                <input type="number" name="clientes">
            </p>

            <p>
                Su correo electrónico:
                <input type="email" name="correo">
            </p>

            <p>
                Su teléfono:
                <input type="tel" name="telefono">
            </p>

            <p>
                Fecha de la reserva:
                <input type="date" name="fecha">
            </p>

            <p>
                Hora de la reserva:
                <input type="time" name="hora">
            </p>

            <p>
                Tu mensaje:
                <br>
                <textarea name="mensaje" rows="4" cols="40"></textarea>
            </p>

            <p>
                <input type="submit" value="Solicitar reserva">
                <input type="reset" value="Borrar datos">
            </p>
        </form>

    </main>

  <footer>
        <p>
            © 2026 Restaurante Chicote el Flaco.Todos los derechos reservados.
        </p>
    </footer>
</body>

</html>
