<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="TU NOMBRE">
    <meta name="description" content="Reseña de los platos">
    <meta name="keywords" content="reseña, platos, restaurante">
    <title>Reseña de un plato</title>
</head>

<body>

    <header>
        <h1>Chicote el Flaco</h1>
        <h2>Deja tu reseña</h2>
    </header>

  
    <nav>
        <a href="../Restaurante/Index.html">Volver al Restaurante</a>
        <br>
        <a href="../index.html">Volver al inicio</a>
        <br>
        <a href="../Restaurante/Carta/Carta.html">Ver la carta</a>
    </nav>


    <main>
        <form>
            <p>
                Nombre:
                <input type="text" name="nombre">
            </p>

            <p>
                Elige el plato:
                <select name="plato">
                    <option value="bocadillo">Bocadillo de lomo</option>
                    <option value="boquerones">Boquerones con vinagre</option>
                    <option value="tortilla">Tortilla de patata</option>
                </select>
            </p>

            <p>
                Escribe tu reseña:
                <br>
                <textarea name="resena" rows="5" cols="40"></textarea>
            </p>

            <input type="submit" value="Enviar reseña">
            <input type="reset" value="Borrar">
        </form>
    </main>
    
<footer>
        <p>
            © 2026 Restaurante Chicote el Flaco.Todos los derechos reservados.
        </p>
    </footer>

</body>
</html>
