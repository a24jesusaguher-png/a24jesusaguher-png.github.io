<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="TU NOMBRE">
    <meta name="description" content="Formulario de contacto">
    <meta name="keywords" content="contacto, restaurante">
    <title>Contacto</title>
</head>

<body>

    <header>
        <h1>Chicote el Flaco</h1>
        <h2>Contacta con nosotros</h2>
    </header>

    <nav>
        <a href="index.html">Volver al Restaurante</a>
        <br>
        <a href="../index.html">Volver al inicio</a>
        <br>
        <a href="../Restaurante/Carta/Carta.html">Ver la carta</a>
    </nav>

    <main>

        <p>Si tienes alguna duda, puedes mandarnos un mensaje.</p>

        <form>

            <p>
                Nombre:
                <input type="text" name="nombre" required>
            </p>

            <p>
                Correo electrónico:
                <input type="email" name="correo" required>
            </p>

            <p>
                Asunto:
                <input type="text" name="asunto">
            </p>

            <p>
                Mensaje:
                <br>
                <textarea name="mensaje" rows="5" cols="40" required></textarea>
            </p>

            <p>
                <input type="submit" value="Enviar mensaje">
                <input type="reset" value="Borrar">
            </p>

        </form>

    </main>

    <footer>
        <p>Restaurante Chicote el Flaco</p>
    </footer>

</body>

</html>
